name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una ejecución por rama: si llegan varios push seguidos, sólo importa el último.
# El despliegue tiene su propio grupo más abajo, porque ahí cancelar sí duele.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # El paso de emuladores se ha colgado dos veces sin nada que lo detuviera:
    # el optimizador de dependencias de Vite falla al crear su directorio
    # temporal y **reintenta para siempre**, así que el job no tiene en qué
    # fallar y el único tope era el de seis horas de GitHub. Con esto falla en
    # veinte minutos y se puede reintentar. Ver AGENTS.md.
    timeout-minutes: 20

    env:
      # Los tests hablan sólo con los emuladores, así que estos valores no
      # necesitan ser reales; el projectId sí debe coincidir con firebase.json.
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: planu-app.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: planu-app
      VITE_FIREBASE_STORAGE_BUCKET: planu-app.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      VITE_AI_CLOUD_FALLBACK: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Los emuladores de Firestore y Storage corren sobre la JVM. 21 como
      # mínimo: firebase-tools 15 rechaza cualquier versión anterior y aborta
      # con «no longer supports Java version before 21».
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `npm ci` y no `npm run setup`: las skills del agente no hacen falta aquí
      # y traerlas metería red y tiempo sin aportar nada a la verificación.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Calidad estática
        run: |
          npm run lint
          npm run typecheck
          npm run lint:lit
          # Vigila la lista de exenciones del trinquete. No necesita emuladores,
          # así que va aquí y no en la tanda lenta.
          npm run test:arch

      - run: npm run build

      # `emulators:exec` levanta, ejecuta y apaga; si algo falla, falla el job.
      #
      # `test:e2e` fuera de esta tanda **a propósito, de momento**: en cuatro
      # runs reales (ver docs/spec-ci-e2e-reliability.md) fallaba de forma
      # intermitente esperando algo en `/app/login`, sin reproducirse nunca en
      # local — ni con la concurrencia igualada, ni subiendo el timeout de
      # 30 s a 60 s (que sólo bajó los fallos de 8-10 a 6, con esos 6 agotando
      # el minuto entero en un clic que en local resuelve en <1 s: más
      # parecido a un cuelgue no acotado que a contención lenta). Añadir 8-10
      # minutos de pipeline por una suite que no puede fallar de forma fiable
      # no aporta como puerta de calidad. Se retoma cuando se entienda la
      # causa real o se reduzca el número de e2e a favor de más unitarios.
      #
      # `vmstat` se deja: sigue siendo útil para `npm test`/`test:rules`, que
      # también corren aquí y podrían sufrir la misma contención.
      - name: Tests con emuladores
        run: |
          nproc
          vmstat 1 > vmstat.log &
          VMSTAT_PID=$!
          npx firebase emulators:exec --project planu-app \
            --only auth,firestore,storage \
            "npm test && npm run test:rules"
          kill "$VMSTAT_PID" 2>/dev/null || true

      - name: CPU/RAM del runner si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vmstat-log
          path: vmstat.log
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Necesario para que el runner pueda pedir su token OIDC.
      id-token: write

    # Grupo propio y **sin** cancel-in-progress: abortar un `firebase deploy` a
    # medias deja el despliegue en un estado que nadie ha revisado.
    concurrency:
      group: deploy-production

    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: planu-app.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: planu-app
      VITE_FIREBASE_STORAGE_BUCKET: planu-app.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: 1:854295039681:web:1181b841906dba24160e40
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_AI_CLOUD_FALLBACK: "false"
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_RELEASE: ${{ github.sha }}
      SENTRY_UPLOAD: "true"
      SENTRY_ORG: jorge-del-casar
      SENTRY_PROJECT: planu
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Workload Identity Federation: GitHub presenta su token OIDC y Google
      # devuelve credenciales que caducan con el job. No hay ninguna clave en
      # los secretos del repositorio. El proveedor sólo acepta tokens cuyo
      # `repository` sea jorgecasar/planu, así que no vale el de otro repo.
      - uses: google-github-actions/auth@v2
        with:
          project_id: planu-app
          workload_identity_provider: projects/854295039681/locations/global/workloadIdentityPools/github/providers/planu
          service_account: github-actions-deploy@planu-app.iam.gserviceaccount.com

      # Un solo comando. El build sale del `predeploy` de firebase.json, con
      # SENTRY_UPLOAD puesto, así que los debug IDs que se suben son los del
      # bundle que se publica. Las reglas van aquí y no a mano porque los 33
      # tests de `test:rules` acaban de pasar en el job anterior.
      - name: Desplegar
        run: |
          npx firebase deploy \
            --only hosting,firestore,storage \
            --project planu-app \
            --message "${{ github.sha }}"

      # Con `-L`, porque desde T25 la raíz redirige a /app y un 302 es la
      # respuesta correcta, no un fallo. Lo que se comprueba es lo que ve un
      # navegador: que la cadena termina en 200 y sirve la aplicación.
      - name: Comprobar que producción responde
        run: |
          for i in $(seq 1 10); do
            leido=$(curl -sL -o /tmp/prod.html -w '%{http_code} %{url_effective}' \
              https://planu-app.web.app)
            code=${leido%% *}
            url=${leido#* }
            if [ "$code" = "200" ] && grep -q 'planu-app\|/assets/' /tmp/prod.html; then
              echo "producción sirve la aplicación en $url"; exit 0
            fi
            echo "intento $i: $code en $url"; sleep 6
          done
          echo "::error::producción no sirve la aplicación tras el despliegue"; exit 1

      # Comprueba que producción sirve las cabeceras que pide firebase.json; el
      # test de `test:arch` sólo puede vigilar el fichero, no lo que sirve
      # Hosting. Va el último y con `continue-on-error`: el despliegue ya está
      # hecho, así que este paso sólo avisa y nunca marca el job en rojo.
      - name: Comprobar cabeceras de seguridad en producción
        continue-on-error: true
        run: |
          curl -sIL https://planu-app.web.app/app > /tmp/headers.txt
          for h in content-security-policy x-frame-options referrer-policy permissions-policy; do
            grep -qi "^$h:" /tmp/headers.txt || { echo "::warning::falta la cabecera $h en producción"; falta=1; }
          done
          grep -i "^content-security-policy:" /tmp/headers.txt | grep -q "frame-ancestors 'none'" \
            || { echo "::warning::la CSP de producción no lleva frame-ancestors 'none'"; falta=1; }
          exit ${falta:-0}
