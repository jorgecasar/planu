name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una ejecución por rama: si llegan varios push seguidos, sólo importa el último.
# El despliegue tiene su propio grupo más abajo, porque ahí cancelar sí duele.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Los tests hablan sólo con los emuladores, así que estos valores no
      # necesitan ser reales; el projectId sí debe coincidir con firebase.json.
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: planu-app.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: planu-app
      VITE_FIREBASE_STORAGE_BUCKET: planu-app.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      VITE_AI_CLOUD_FALLBACK: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Los emuladores de Firestore y Storage corren sobre la JVM. 21 como
      # mínimo: firebase-tools 15 rechaza cualquier versión anterior y aborta
      # con «no longer supports Java version before 21».
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `npm ci` y no `npm run setup`: las skills del agente no hacen falta aquí
      # y traerlas metería red y tiempo sin aportar nada a la verificación.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Calidad estática
        run: |
          npm run lint
          npm run typecheck
          npm run lint:lit
          # Vigila la lista de exenciones del trinquete. No necesita emuladores,
          # así que va aquí y no en la tanda lenta.
          npm run test:arch

      - run: npm run build

      # `emulators:exec` levanta, ejecuta y apaga; si algo falla, falla el job.
      - name: Tests con emuladores
        run: |
          npx firebase emulators:exec --project planu-app \
            --only auth,firestore,storage \
            "npm test && npm run test:rules && npm run test:e2e"

      - name: Informe de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Necesario para que el runner pueda pedir su token OIDC.
      id-token: write

    # Grupo propio y **sin** cancel-in-progress: abortar un `firebase deploy` a
    # medias deja el despliegue en un estado que nadie ha revisado.
    concurrency:
      group: deploy-production

    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: planu-app.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: planu-app
      VITE_FIREBASE_STORAGE_BUCKET: planu-app.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: 1:854295039681:web:1181b841906dba24160e40
      VITE_AI_CLOUD_FALLBACK: "false"
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_RELEASE: ${{ github.sha }}
      SENTRY_UPLOAD: "true"
      SENTRY_ORG: jorge-del-casar
      SENTRY_PROJECT: planu
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Workload Identity Federation: GitHub presenta su token OIDC y Google
      # devuelve credenciales que caducan con el job. No hay ninguna clave en
      # los secretos del repositorio. El proveedor sólo acepta tokens cuyo
      # `repository` sea jorgecasar/planu, así que no vale el de otro repo.
      - uses: google-github-actions/auth@v2
        with:
          project_id: planu-app
          workload_identity_provider: projects/854295039681/locations/global/workloadIdentityPools/github/providers/planu
          service_account: github-actions-deploy@planu-app.iam.gserviceaccount.com

      # Un solo comando. El build sale del `predeploy` de firebase.json, con
      # SENTRY_UPLOAD puesto, así que los debug IDs que se suben son los del
      # bundle que se publica. Las reglas van aquí y no a mano porque los 33
      # tests de `test:rules` acaban de pasar en el job anterior.
      - name: Desplegar
        run: |
          npx firebase deploy \
            --only hosting,firestore,storage \
            --project planu-app \
            --message "${{ github.sha }}"

      - name: Comprobar que producción responde
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://planu-app.web.app)
            [ "$code" = "200" ] && echo "planu-app.web.app responde 200" && exit 0
            echo "intento $i: $code"; sleep 6
          done
          echo "::error::producción no responde 200 tras el despliegue"; exit 1
