name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una ejecución por rama: si llegan varios push seguidos, sólo importa el último.
# El despliegue tiene su propio grupo más abajo, porque ahí cancelar sí duele.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Los tests hablan sólo con los emuladores, así que estos valores no
      # necesitan ser reales; el projectId sí debe coincidir con firebase.json.
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: planu-app.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: planu-app
      VITE_FIREBASE_STORAGE_BUCKET: planu-app.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      VITE_AI_CLOUD_FALLBACK: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Los emuladores de Firestore y Storage corren sobre la JVM. 21 como
      # mínimo: firebase-tools 15 rechaza cualquier versión anterior y aborta
      # con «no longer supports Java version before 21».
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `npm ci` y no `npm run setup`: las skills del agente no hacen falta aquí
      # y traerlas metería red y tiempo sin aportar nada a la verificación.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Calidad estática
        run: |
          npm run lint
          npm run typecheck
          npm run lint:lit

      - run: npm run build

      # `emulators:exec` levanta, ejecuta y apaga; si algo falla, falla el job.
      - name: Tests con emuladores
        run: |
          npx firebase emulators:exec --project planu-app \
            --only auth,firestore,storage \
            "npm test && npm run test:rules && npm run test:e2e"

      - name: Informe de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Canal temporal por PR. Sirve para lo que los e2e no cubren: comprobar la CSP
  # y las cabeceras de caché reales, que corren contra `npm run dev` y por tanto
  # nunca ven la configuración de hosting.
  preview:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.preview.outputs.url }}
      domain: ${{ steps.preview.outputs.domain }}
    permissions:
      contents: read
      pull-requests: write
      # Necesario para que el runner pueda pedir su token OIDC.
      id-token: write

    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: planu-app.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: planu-app
      VITE_FIREBASE_STORAGE_BUCKET: planu-app.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: 1:854295039681:web:1181b841906dba24160e40
      VITE_AI_CLOUD_FALLBACK: "false"
      VITE_RELEASE: pr-${{ github.event.number }}-${{ github.sha }}
      # Sin VITE_SENTRY_DSN y sin SENTRY_UPLOAD, a propósito. Un preview no
      # debe mandar errores: gastaría cuota de eventos y, como sus source maps
      # no se suben, llegarían minificados y atribuidos a una release que no
      # existe. Sin DSN, `startErrorTracking()` sale sin hacer nada.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Workload Identity Federation: GitHub presenta su token OIDC y Google
      # devuelve credenciales que caducan con el job. No hay ninguna clave en
      # los secretos del repositorio. El proveedor sólo acepta tokens cuyo
      # `repository` sea jorgecasar/planu, así que no vale el de otro repo.
      - uses: google-github-actions/auth@v2
        with:
          project_id: planu-app
          workload_identity_provider: projects/854295039681/locations/global/workloadIdentityPools/github/providers/planu
          service_account: github-actions-deploy@planu-app.iam.gserviceaccount.com

      # El build lo dispara el `predeploy` de firebase.json: un solo build, y
      # por tanto imposible que se despliegue algo distinto de lo construido.
      - name: Desplegar canal de preview
        id: preview
        env:
          CANAL: pr-${{ github.event.number }}
        run: |
          npx firebase hosting:channel:deploy "$CANAL" --project planu-app --expires 7d

          # La URL se consulta aparte y no del --json de `channel:deploy`: ese
          # comando dispara el predeploy, y la salida de `npm run build` sale
          # por el mismo stdout, así que el JSON llega precedido de basura.
          # `channel:list` no tiene predeploy y devuelve JSON limpio.
          URL=$(npx firebase hosting:channel:list --project planu-app --json \
            | node -e '
              let s = "";
              process.stdin.on("data", (d) => { s += d; });
              process.stdin.on("end", () => {
                const canal = JSON.parse(s).result.channels.find(
                  (c) => c.name.endsWith("/" + process.env.CANAL),
                );
                process.stdout.write(canal?.url ?? "");
              });')

          if [ -z "$URL" ]; then
            echo "::error::el canal $CANAL no aparece tras desplegarlo"; exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "domain=$(printf '%s' "$URL" | sed -E 's#^https?://##; s#/.*##')" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview desplegado"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar la URL en el PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.number }}" --edit-last --create-if-none \
            --body "Preview de \`${{ github.sha }}\`: ${{ steps.preview.outputs.url }}

          Caduca en 7 días. Es el único sitio donde se pueden comprobar la CSP y
          las cabeceras de caché reales antes de fusionar."

  # Firebase Auth only allows OAuth from domains on its authorized list, and it
  # accepts no wildcards. Every preview channel gets a fresh
  # `planu-app--<channel>-<hash>.web.app`, so without this step the console
  # warns "The current domain is not authorized for OAuth operations" and
  # `signInWithPopup` never opens. Email and password keep working, which is
  # what makes the breakage easy to miss.
  authorize-preview-domain:
    if: github.event_name == 'pull_request'
    needs: preview
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    # Shared across every pull request on purpose. The Identity Toolkit admin
    # API has no "append" endpoint, so writing the list is a read-modify-write
    # of the whole thing: two pull requests deploying at once would clobber
    # each other. This serializes only the mutation, not the preview deploys,
    # which stay parallel.
    concurrency:
      group: firebase-auth-domains
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # `token_format: access_token` is what makes the token usable against a
      # plain REST API; the default only sets up the credentials file.
      - uses: google-github-actions/auth@v2
        id: gcp
        with:
          project_id: planu-app
          workload_identity_provider: projects/854295039681/locations/global/workloadIdentityPools/github/providers/planu
          service_account: github-actions-deploy@planu-app.iam.gserviceaccount.com
          token_format: access_token

      # Never fatal: a preview with broken OAuth is still worth having, and
      # failing here would hide a perfectly good deploy behind a red check.
      - name: Authorize the preview domain for OAuth
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          DOMAIN: ${{ needs.preview.outputs.domain }}
        run: |
          node scripts/sync-auth-domains.js --add "$DOMAIN" || {
            echo "::warning::could not authorize $DOMAIN for OAuth. The preview is deployed and email/password sign-in works; only 'Continue with Google' is affected."
          }

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Necesario para que el runner pueda pedir su token OIDC.
      id-token: write

    # Grupo propio y **sin** cancel-in-progress: abortar un `firebase deploy` a
    # medias deja el despliegue en un estado que nadie ha revisado.
    concurrency:
      group: deploy-production

    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: planu-app.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: planu-app
      VITE_FIREBASE_STORAGE_BUCKET: planu-app.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: 1:854295039681:web:1181b841906dba24160e40
      VITE_AI_CLOUD_FALLBACK: "false"
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_RELEASE: ${{ github.sha }}
      SENTRY_UPLOAD: "true"
      SENTRY_ORG: jorge-del-casar
      SENTRY_PROJECT: planu
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Workload Identity Federation: GitHub presenta su token OIDC y Google
      # devuelve credenciales que caducan con el job. No hay ninguna clave en
      # los secretos del repositorio. El proveedor sólo acepta tokens cuyo
      # `repository` sea jorgecasar/planu, así que no vale el de otro repo.
      - uses: google-github-actions/auth@v2
        with:
          project_id: planu-app
          workload_identity_provider: projects/854295039681/locations/global/workloadIdentityPools/github/providers/planu
          service_account: github-actions-deploy@planu-app.iam.gserviceaccount.com

      # Un solo comando. El build sale del `predeploy` de firebase.json, con
      # SENTRY_UPLOAD puesto, así que los debug IDs que se suben son los del
      # bundle que se publica. Las reglas van aquí y no a mano porque los 33
      # tests de `test:rules` acaban de pasar en el job anterior.
      - name: Desplegar
        run: |
          npx firebase deploy \
            --only hosting,firestore,storage \
            --project planu-app \
            --message "${{ github.sha }}"

      - name: Comprobar que producción responde
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://planu-app.web.app)
            [ "$code" = "200" ] && echo "planu-app.web.app responde 200" && exit 0
            echo "intento $i: $code"; sleep 6
          done
          echo "::error::producción no responde 200 tras el despliegue"; exit 1
